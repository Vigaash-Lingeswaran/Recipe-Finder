<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Recipe Finder</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1 style = "text-align: center" >Recipe Finder</h1>
        <p style = "text-align: center">Enter your ingredients (separated by commas):</p>
        <div id="result" class="result-box"></div>
        <form id="searchForm" class="search" role="search" aria-label="Recipe search">
            <label for="q" class="sr-only">Search recipes</label>
            <input id="q" name="q" placeholder="Search ingredients (e.g., egg, cheese, tomato)" />
            <button onclick="findRecipe()" class="btn primary">Search</button>
        </form>
    </div>
    <script src="app.js"></script>
</body>
</html>
